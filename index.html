<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>QR code component | Tailwind Refactor</title>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center gap-5 bg-slate-100 font-[Outfit]"
  >
    <main class="flex flex-col gap-6 w-80 p-4 rounded-2xl bg-white max-w-full">
      <img class="rounded-xl" src="images/image-qr-code.png" alt="QR-Code" />
      <section class="flex flex-col justify-center px-4 py-0 gap-4">
        <h1 class="text-[#1f314f] text-[22px]/[1.2] text-center font-bold m-0">
          Improve your front-end skills by building projects
        </h1>
        <p
          class="text-[#68778d] m-0 text-[15px]/[1.4] text-center font-normal tracking-[0.2]"
        >
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </section>
    </main>
    <footer class="text-center">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        class="text-blue-800 focus-visible:outline focus-visible:outline-[1.5px] focus-visible:outline-red-500"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://toni-thomas.vercel.app/"
        target="_blank"
        class="text-blue-800 focus-visible:outline focus-visible:outline-[1.5px] focus-visible:outline-red-500"
        >Toni Thomas</a
      >.
    </footer>
  </body>
</html>
